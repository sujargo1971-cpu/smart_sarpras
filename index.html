      state.showLoginPass = !state.showLoginPass;

      const eyeOpen = document.getElementById('eye-icon-open');
      const eyeClosed = document.getElementById('eye-icon-closed');

        ((u.username || '').toLowerCase() === 'gtk') ||
        u.pageAccess === 'halaman_1_gtk'
      );
      return (gtk && (gtk.accessCode || gtk.password)) ? String(gtk.accessCode || gtk.password).trim() : 'gtk123';
    }

    function saveLocal() {
      localStorage.setItem('smart_sarpras_html_profile', JSON.stringify(state.schoolProfile));
      localStorage.setItem('smart_sarpras_html_assets', JSON.stringify(state.assets));
      localStorage.setItem('smart_sarpras_html_users', JSON.stringify(state.users));
      localStorage.setItem('smart_sarpras_html_script_url', state.scriptUrl || '');
    }

    function formatIDR(num) {
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(num || 0);
    }

    // =========================================================================
    // KONEKSI DATABASE GOOGLE SHEETS (READ & WRITE)
    // =========================================================================
    async function pullFromGoogleSheets() {
      if (!state.scriptUrl) {
        alert('Silakan masukkan URL Web App Google Sheets terlebih dahulu pada menu Pengaturan Google Sheets.');
        return;
      }
      state.syncStatus = 'Menarik data dari Google Sheets...';
      render();
      try {
        const sep = state.scriptUrl.includes('?') ? '&' : '?';
        const res = await fetch(state.scriptUrl + sep + 'action=readAll');
        const data = await res.json();
        if (data && Array.isArray(data.assets)) {
          state.assets = data.assets;
          if (Array.isArray(data.users) && data.users.length > 0) state.users = data.users;
          if (data.schoolProfile && data.schoolProfile.name) state.schoolProfile = data.schoolProfile;
          saveLocal();
          state.syncStatus = 'Berhasil memuat ' + data.assets.length + ' aset dari Google Sheets!';
        } else {
          state.syncStatus = 'Format data Google Sheets belum sesuai.';
        }
      } catch (e) {
        state.syncStatus = 'Gagal menarik dari Google Sheets: ' + e.message;
      }
      render();
    }

    async function pushToGoogleSheets() {
      saveLocal();
      if (!state.scriptUrl) return;
      state.syncStatus = 'Menyimpan ke Google Sheets...';
      render();
      try {
        await fetch(state.scriptUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'syncAll',
            assets: state.assets,
            users: state.users,
            schoolProfile: state.schoolProfile
          })
        });
        state.syncStatus = 'Tersinkronisasi otomatis ke Google Sheets (' + new Date().toLocaleTimeString('id-ID') + ')';
      } catch (e) {
        state.syncStatus = 'Data tersimpan lokal (Offline dari Google Sheets)';
      }
      render();
    }

    // =========================================================================
    function handleLogin(e) {
      e.preventDefault();
      const userSelect = document.getElementById('login-user').value;
      const passInp = document.getElementById('login-pass').value.trim();

      if (!passInp) {
        state.loginError = 'Silakan masukkan Password Anda!';
        render();
        return;
      }

      if (userSelect === 'GTK') {
        const expectedGtkPass = getGtkPassword();
        if (passInp === expectedGtkPass || passInp.toLowerCase() === expectedGtkPass.toLowerCase()) {
          state.currentUser = {
            name: 'Guru & Tenaga Kependidikan',
            username: 'GTK',
            role: 'Guru & Tenaga Kependidikan (Read-Only)',
            pageAccess: 'halaman_1_gtk'
          };
          state.currentPage = 'halaman_1_gtk';
          state.loginError = '';
          render();
          return;
        }
        state.loginError = 'Password untuk Username GTK tidak sesuai!';
        render();
        return;
      }

      if (userSelect === 'Admin') {
        const expectedAdminPass = getAdminPassword();
        if (passInp === expectedAdminPass || passInp.toLowerCase() === expectedAdminPass.toLowerCase()) {
          state.currentUser = {
            name: state.schoolProfile.headmasterName || 'Admin Sarpras',
            username: 'Admin',
            role: 'Admin Sarpras (Input & Edit Data)',
            pageAccess: 'halaman_2_admin'
          };
          state.currentPage = 'halaman_2_admin';
          state.loginError = '';
          render();
          return;
        }
        state.loginError = 'Password untuk Username Admin tidak sesuai!';
        render();
        return;
      }
    }

      e.preventDefault();
      const newGtkPass = document.getElementById('new-gtk-pass').value.trim();
      const newAdminPass = document.getElementById('new-admin-pass').value.trim();

      if (!newGtkPass || !newAdminPass) {

    function saveAssetForm(e) {
      e.preventDefault();
      const form = e.target;
      const item = {
        id: state.editingAsset ? state.editingAsset.id : 'ast-' + Date.now(),
        code: form.code.value.trim(),
        name: form.name.value.trim(),
        category: form.category.value,
        brandOrPublisher: form.brandOrPublisher.value.trim() || '-',
        roomLocation: form.roomLocation.value.trim() || 'Ruang Kelas',
        quantity: Number(form.quantity.value) || 1,
        unit: form.unit.value.trim() || 'Unit',
        condition: form.condition.value,
        acquisitionYear: Number(form.acquisitionYear.value) || 2025,

        priceEstimated: Number(form.priceEstimated.value) || 0,
        picPerson: form.picPerson.value.trim() || 'Tim Sarpras',
        serialNumber: form.serialNumber.value.trim() || '-',
        lastCheckedAt: new Date().toISOString().slice(0, 10),
        description: form.description.value.trim()
      };

      if (state.editingAsset) {
        state.assets = state.assets.map(a => a.id === item.id ? item : a);
      } else {
        state.assets = [item, ...state.assets];
      }
      state.showAssetModal = false;
      state.editingAsset = null;
      pushToGoogleSheets();
    }

                  <span class="font-extrabold text-blue-950">1. Username: GTK</span>
                  <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-blue-100 text-blue-800">Halaman 1 (Read-Only)</span>
                </div>
                <label class="block text-[11px] font-semibold text-blue-900">Password GTK:</label>
                <input id="new-gtk-pass" type="text" required value="${currentGtkPass}"
                  class="w-full px-3 py-2 bg-white border border-blue-300 rounded-lg font-mono font-bold text-slate-900" />
              </div>

              <div class="p-3.5 rounded-xl bg-emerald-50 border border-emerald-200 space-y-1.5">
                <div class="flex items-center justify-between">
                  <span class="font-extrabold text-emerald-950">2. Username: Admin</span>
                  <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-emerald-100 text-emerald-800">Halaman 2 (Input & Edit)</span>
                </div>
                <label class="block text-[11px] font-semibold text-emerald-900">Password Admin:</label>
                <input id="new-admin-pass" type="text" required value="${currentAdminPass}"
                  class="w-full px-3 py-2 bg-white border border-emerald-300 rounded-lg font-mono font-bold text-slate-900" />
              </div>

              <div class="flex justify-end gap-2 pt-2 border-t border-slate-200">
                <button type="button" onclick="state.showPasswordModal=false; render();"
                  class="px-4 py-2 rounded-xl bg-slate-100 text-slate-700 font-bold cursor-pointer">
                  Batal
                </button>
                <button type="submit"
                  class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold cursor-pointer">
                  Simpan & Sinkronkan Password
                </button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    function renderAssetModal() {
      const a = state.editingAsset || {
        code: 'INV-' + Math.floor(1000 + Math.random() * 9000),
        name: '',
        category: 'elektronik',
        brandOrPublisher: '',
        roomLocation: 'Ruang Kelas 1',
        quantity: 1,
        unit: 'Unit',
        condition: 'baik',
        acquisitionYear: 2025,
        sourceOfFund: 'BOS Reguler',
        priceEstimated: 1500000,
        picPerson: 'Tim Sarpras',
        serialNumber: '-',
        description: ''
      };
      return `
        <div class="fixed inset-0 z-50 bg-slate-900/60 flex items-center justify-center p-4 overflow-y-auto">
          <div class="bg-white rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-2xl">
            <div class="flex items-center justify-between border-b border-slate-200 pb-3">
              <h3 class="text-base font-extrabold text-slate-900">${state.editingAsset ? 'Edit Data Aset (Halaman 2 Admin)' : 'Input Data Aset Baru (Halaman 2 Admin)'}</h3>
              <button onclick="state.showAssetModal=false; render();" class="text-slate-400 hover:text-slate-700 font-bold">✕</button>
            </div>
            <form onsubmit="saveAssetForm(event)" class="space-y-3 text-xs">
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block font-bold mb-1">Kode Aset *</label>
                  <input name="code" required value="${a.code}" class="w-full px-3 py-2 border border-slate-300 rounded-lg font-mono" />
                </div>
                <div>
                  <label class="block font-bold mb-1">Kategori *</label>
                  <select name="category" class="w-full px-3 py-2 border border-slate-300 rounded-lg">
                    <option value="elektronik" ${a.category==='elektronik'?'selected':''}>Elektronik & TIK</option>
                    <option value="buku" ${a.category==='buku'?'selected':''}>Buku & Pustaka</option>
                    <option value="meubelair" ${a.category==='meubelair'?'selected':''}>Meubelair</option>
                    <option value="ruang" ${a.category==='ruang'?'selected':''}>Ruang & Bangunan</option>
                    <option value="sarana_lainnya" ${a.category==='sarana_lainnya'?'selected':''}>Sarana Lainnya</option>
                  </select>
                </div>
              </div>
              <div>
                <label class="block font-bold mb-1">Nama Barang *</label>
                <input name="name" required value="${a.name}" class="w-full px-3 py-2 border border-slate-300 rounded-lg" />
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block font-bold mb-1">Merk / Penerbit</label>
                  <input name="brandOrPublisher" value="${a.brandOrPublisher}" class="w-full px-3 py-2 border border-slate-300 rounded-lg" />
                </div>
                <div>
                  <label class="block font-bold mb-1">Lokasi Ruang *</label>
                  <input name="roomLocation" required value="${a.roomLocation}" class="w-full px-3 py-2 border border-slate-300 rounded-lg" />
                </div>
              </div>
              <div class="grid grid-cols-3 gap-3">
                <div>
                  <label class="block font-bold mb-1">Jumlah *</label>
                  <input type="number" name="quantity" required value="${a.quantity}" class="w-full px-3 py-2 border border-slate-300 rounded-lg" />
                </div>
                <div>
                  <label class="block font-bold mb-1">Satuan</label>
                  <input name="unit" value="${a.unit}" class="w-full px-3 py-2 border border-slate-300 rounded-lg" />
                </div>
                <div>
                  <label class="block font-bold mb-1">Kondisi *</label>
                  <select name="condition" class="w-full px-3 py-2 border border-slate-300 rounded-lg">
                    <option value="baik" ${a.condition==='baik'?'selected':''}>Baik</option>
                    <option value="rusak_ringan" ${a.condition==='rusak_ringan'?'selected':''}>Rusak Ringan</option>
                    <option value="rusak_berat" ${a.condition==='rusak_berat'?'selected':''}>Rusak Berat</option>
                  </select>
                </div>
              </div>
              <div class="grid grid-cols-3 gap-3">
                <div>
                  <label class="block font-bold mb-1">Tahun</label>
                  <input type="number" name="acquisitionYear" value="${a.acquisitionYear}" class="w-full px-3 py-2 border border-slate-300 rounded-lg" />
                </div>
                <div>
                  <label class="block font-bold mb-1">Sumber Dana</label>
                  <input name="sourceOfFund" value="${a.sourceOfFund}" class="w-full px-3 py-2 border border-slate-300 rounded-lg" />
                </div>
                <div>
                  <label class="block font-bold mb-1">Harga Satuan (Rp)</label>
                  <input type="number" name="priceEstimated" value="${a.priceEstimated}" class="w-full px-3 py-2 border border-slate-300 rounded-lg" />
                </div>
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block font-bold mb-1">Penanggung Jawab</label>
                  <input name="picPerson" value="${a.picPerson}" class="w-full px-3 py-2 border border-slate-300 rounded-lg" />
                </div>
                <div>
                  <label class="block font-bold mb-1">Nomor Seri</label>
                  <input name="serialNumber" value="${a.serialNumber || '-'}" class="w-full px-3 py-2 border border-slate-300 rounded-lg" />
                </div>
              </div>
              <div>
                <label class="block font-bold mb-1">Keterangan</label>
                <input name="description" value="${a.description || ''}" class="w-full px-3 py-2 border border-slate-300 rounded-lg" />
              </div>
              <div class="flex justify-end gap-2 pt-3 border-t border-slate-200">
                <button type="button" onclick="state.showAssetModal=false; render();" class="px-4 py-2 rounded-xl bg-slate-100 text-slate-700 font-bold">Batal</button>
                <button type="submit" class="px-5 py-2 rounded-xl bg-emerald-600 text-white font-bold">Simpan & Sinkronkan ke Google Sheets</button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    function renderSheetsModal() {
      return `
        <div class="fixed inset-0 z-50 bg-slate-900/60 flex items-center justify-center p-4">
          <div class="bg-white rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-2xl text-xs">
            <div class="flex items-center justify-between border-b border-slate-200 pb-3">
              <h3 class="text-base font-extrabold text-slate-900">Koneksi Database Google Sheets</h3>
              <button onclick="state.showSheetsModal=false; render();" class="text-slate-400 hover:text-slate-700 font-bold">✕</button>
            </div>
            <div>
              <label class="block font-bold text-slate-700 mb-1">URL Web App Google Apps Script (.../exec)</label>
              <input id="gsheet-url-inp" type="url" value="${state.scriptUrl}" placeholder="https://script.google.com/macros/s/.../exec"
                class="w-full px-3 py-2 border border-slate-300 rounded-xl font-mono text-xs" />
              <p class="text-[11px] text-slate-500 mt-1">Tempelkan URL hasil Deploy Web App dari Google Sheets Anda.</p>
            </div>
            <div class="flex justify-end gap-2 pt-2">
              <button onclick="state.scriptUrl=document.getElementById('gsheet-url-inp').value.trim(); saveLocal(); state.showSheetsModal=false; pushToGoogleSheets();"
                class="px-4 py-2 bg-indigo-600 text-white font-bold rounded-xl cursor-pointer">
                Simpan & Sinkronkan Sekarang
              </button>
            </div>
          </div>
        </div>
      `;
    }

    render();
  </script>
</body>
</html>
